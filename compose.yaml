services:
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATA_ROOT: ${DATA_ROOT:-/data}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
      SUPPORTED_MODELS: ${SUPPORTED_MODELS:-large-v3-turbo}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATA_ROOT: ${DATA_ROOT:-/data}
      MODEL_ROOT: ${MODEL_ROOT:-/models}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WORKER_ID: ${WORKER_ID:-gpu-worker-01}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-5}
      STALE_TIMEOUT_SECONDS: ${STALE_TIMEOUT_SECONDS:-30}
    volumes:
      - ./data:/data
      - ./models:/models
    gpus: all
    depends_on:
      api-server:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speech_asr}
      POSTGRES_USER: ${POSTGRES_USER:-speech_asr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
